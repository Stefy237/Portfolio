# Déploiement sur Cloudflare Pages à chaque push sur main (ou à la demande).
# La CI s'exécute d'abord : si elle échoue, rien n'est publié.
# Prérequis :
#   - secrets du dépôt : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   - variables du dépôt (facultatives) : CF_PAGES_PROJECT (nom du projet Pages), SITE_URL
#     Sans elles : projet « laura-nguegang », site https://laura-nguegang.pages.dev
# Tant que le secret CLOUDFLARE_API_TOKEN n'existe pas, la publication est ignorée.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Publier
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL || 'https://laura-nguegang.pages.dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer le site validé par la CI
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publier sur Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'laura-nguegang' }} --branch=main

      - name: Contrôler la production
        if: ${{ env.CF_TOKEN != '' }}
        run: |
          headers=$(curl -fsSI --retry 5 --retry-delay 5 --retry-all-errors "$SITE_URL")
          grep -qi '^strict-transport-security:' <<< "$headers"
          grep -qi '^content-security-policy:' <<< "$headers"
          grep -qi '^x-content-type-options: nosniff' <<< "$headers"

      - name: Déploiement ignoré
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "::notice::Secret CLOUDFLARE_API_TOKEN absent, déploiement ignoré."
